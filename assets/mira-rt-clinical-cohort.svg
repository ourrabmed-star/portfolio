<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Acute grade 3 radiotherapy-related toxicity in a 1.5 tesla MR-Linac cohort</title>
<desc id="desc">Reported toxicity was 23 of 1,697 reviewed treatment courses, 1.4 percent with 95 percent confidence interval 0.9 to 2.0 percent overall; among the adapt-to-shape subset, 4 of 1,005 courses, 0.4 percent with confidence interval 0.1 to 1.0 percent.</desc>
<rect width="1200" height="700" rx="28" fill="#f4f5ef"/>
<text x="60" y="72" fill="#657270" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="3">MIRA-RT · FIGURE 02</text>
<text x="60" y="128" fill="#10201f" font-family="Arial,sans-serif" font-size="40" font-weight="700">Acute grade 3 RT-related toxicity</text>
<text x="60" y="166" fill="#657270" font-family="Arial,sans-serif" font-size="22">1.5 T MR-Linac observational cohort · proportions with 95% confidence intervals</text>
<text x="60" y="278" fill="#10201f" font-family="Arial,sans-serif" font-size="24" font-weight="700">All reviewed courses</text>
<text x="60" y="313" fill="#657270" font-family="Arial,sans-serif" font-size="19">23 / 1,697 · 1.4%</text>
<text x="60" y="414" fill="#10201f" font-family="Arial,sans-serif" font-size="24" font-weight="700">Adapt-to-shape (ATS)</text>
<text x="60" y="449" fill="#657270" font-family="Arial,sans-serif" font-size="19">4 / 1,005 · 0.4%</text>
